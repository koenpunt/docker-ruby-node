name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  schedule:
    # Weekly rebuild to pick up security patches in the Ruby base images
    - cron: '0 4 * * 1'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - id: images
        run: echo "images=$(jq -c .images versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.images) }}
    name: Build image ${{ matrix.ruby_version }}-${{ matrix.node_major }}-${{ matrix.variant }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag list
        id: tags
        run: |
          {
            echo 'tags<<EOF'
            echo '${{ matrix.tags }}' | tr ',' '\n' | sed 's/^/type=raw,value=/'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            koen/ruby-node
          tags: ${{ steps.tags.outputs.tags }}
          flavor: |
            latest=false

      - name: Build
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ruby-node:test
          cache-from: type=gha,scope=${{ matrix.ruby_version }}-${{ matrix.node_major }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ruby_version }}-${{ matrix.node_major }}-${{ matrix.variant }}
          build-args: |
            RUBY_VERSION=${{ matrix.ruby_version }}

      - name: Smoke test
        run: |
          docker run --rm ruby-node:test sh -ec '
            ruby -e "abort \"unexpected Ruby #{RUBY_VERSION}\" unless RUBY_VERSION.start_with?(\"${{ matrix.ruby_version }}.\")"
            node -e "if (process.versions.node.split(\".\")[0] !== \"${{ matrix.node_major }}\") throw new Error(\"unexpected Node \" + process.version)"
            ruby -v && node -v && npm -v && yarn -v && gem -v && bundle -v
          '

      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.ruby_version }}-${{ matrix.node_major }}-${{ matrix.variant }}
          build-args: |
            RUBY_VERSION=${{ matrix.ruby_version }}
