name: Update versions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate from upstream images
        run: python3 update.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # Pull requests opened with the default GITHUB_TOKEN don't trigger the
          # build workflow, so prefer a token with repo access when one is set.
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: update-versions
          delete-branch: true
          commit-message: Update Ruby and Node.js versions
          title: Update Ruby and Node.js versions
          body: |
            Regenerated by `update.py` from the official
            [Ruby](https://github.com/docker-library/ruby) and
            [Node.js](https://github.com/nodejs/docker-node) images.
